<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>电力价格风控助手</title>
<style>
  :root {
    --bg: #0f1220; --panel: #171b2e; --bubble-user: #2f6df6;
    --bubble-bot: #232842; --text: #e8ebf5; --muted: #9aa3c0;
    --tool: #2b3358; --accent: #5b8cff; --border: #2a3050;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: linear-gradient(160deg, #0f1220, #141a30);
    color: var(--text); font-family: -apple-system, "Segoe UI", "PingFang SC",
    "Microsoft YaHei", sans-serif;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    background: rgba(23,27,46,.7); backdrop-filter: blur(8px);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .sub { font-size: 12px; color: var(--muted); margin-left: 10px; }
  #newChat {
    background: var(--tool); color: var(--text); border: 1px solid var(--border);
    padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  #newChat:hover { border-color: var(--accent); }
  #log {
    flex: 1; overflow-y: auto; padding: 20px; display: flex;
    flex-direction: column; gap: 14px; max-width: 820px; width: 100%; margin: 0 auto;
  }
  .row { display: flex; gap: 10px; align-items: flex-start; }
  .row.user { flex-direction: row-reverse; }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%; flex: 0 0 30px;
    display: grid; place-items: center; font-size: 14px; font-weight: 700;
    background: var(--tool);
  }
  .row.user .avatar { background: var(--bubble-user); }
  .bubble {
    max-width: 78%; padding: 11px 14px; border-radius: 14px; line-height: 1.55;
    font-size: 14px; white-space: pre-wrap; word-break: break-word;
    background: var(--bubble-bot);
  }
  .row.user .bubble { background: var(--bubble-user); }
  .tool {
    align-self: flex-start; max-width: 78%; font-size: 12.5px; color: var(--muted);
    background: var(--tool); border: 1px solid var(--border); border-radius: 10px;
    padding: 7px 11px;
  }
  .tool b { color: var(--accent); }
  .tool .res { color: #7ee0a1; }
  .typing { color: var(--muted); font-size: 13px; font-style: italic; }
  footer {
    border-top: 1px solid var(--border); padding: 12px 20px;
    display: flex; gap: 10px; max-width: 820px; width: 100%; margin: 0 auto;
  }
  #input {
    flex: 1; resize: none; height: 46px; max-height: 140px; padding: 12px 14px;
    border-radius: 12px; border: 1px solid var(--border); background: var(--panel);
    color: var(--text); font-size: 14px; font-family: inherit; outline: none;
  }
  #input:focus { border-color: var(--accent); }
  #send {
    background: var(--bubble-user); color: #fff; border: none; border-radius: 12px;
    padding: 0 22px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  #send:disabled { opacity: .5; cursor: default; }
  .err { color: #ff8080; }
</style>
</head>
<body>
  <header>
    <div><h1>电力价格风控助手</h1><span class="sub">方式一 · 自然语言反问</span></div>
    <button id="newChat">新对话</button>
  </header>

  <div id="log"></div>

  <footer>
    <textarea id="input" placeholder="输入问题，如：当前电价尖峰风险高吗？"></textarea>
    <button id="send">发送</button>
  </footer>

<script>
const API_KEY = "risk-demo-secret-key";  // 与服务端 RISK_API_KEY 一致
// 每个浏览器标签 = 一个会话；用 localStorage 固定 thread_id 实现多轮记忆
let threadId = localStorage.getItem("risk_thread") || (crypto.randomUUID());
localStorage.setItem("risk_thread", threadId);

const logEl = document.getElementById("log");
const inputEl = document.getElementById("input");
const sendEl = document.getElementById("send");

let rendered = 0;     // 已渲染的消息数（服务端每次返回全量轨迹）
let busy = false;

function scrollDown() { logEl.scrollTop = logEl.scrollHeight; }

function addRow(side, text, cls = "bubble") {
  const row = document.createElement("div");
  row.className = "row " + side;
  const av = document.createElement("div");
  av.className = "avatar"; av.textContent = side === "user" ? "我" : "AI";
  const b = document.createElement("div");
  b.className = cls; b.textContent = text;
  row.appendChild(av); row.appendChild(b);
  logEl.appendChild(row); scrollDown();
  return b;
}

function renderMessages(messages) {
  for (let i = rendered; i < messages.length; i++) {
    const m = messages[i];
    if (m.role === "user") {
      addRow("user", m.content);
    } else if (m.role === "assistant") {
      (m.tool_calls || []).forEach(tc =>
        addRow("bot", "🔧 调用工具 " + tc.name + "(" +
          JSON.stringify(tc.args || {}) + ")", "tool"));
      if (m.content) addRow("bot", m.content);
    } else if (m.role === "tool") {
      addRow("bot", "↳ 工具结果：" + m.content, "tool");
      const last = logEl.lastElementChild.querySelector(".tool");
      if (last) last.classList.add("res");
    }
  }
  rendered = messages.length;
}

async function send() {
  const text = inputEl.value.trim();
  if (!text || busy) return;
  addRow("user", text);
  inputEl.value = "";
  busy = true; sendEl.disabled = true;
  const typing = addRow("bot", "思考中…", "typing");

  try {
    const resp = await fetch("/agent/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-API-Key": API_KEY },
      body: JSON.stringify({ message: text, thread_id: threadId }),
    });
    const data = await resp.json();
    typing.remove();
    if (!resp.ok) {
      addRow("bot", "错误：" + (data.detail || resp.statusText), "err");
    } else {
      renderMessages(data.messages);
    }
  } catch (e) {
    typing.remove();
    addRow("bot", "请求失败：" + e.message, "err");
  } finally {
    busy = false; sendEl.disabled = false; inputEl.focus();
  }
}

sendEl.onclick = send;
inputEl.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
document.getElementById("newChat").onclick = () => {
  threadId = crypto.randomUUID();
  localStorage.setItem("risk_thread", threadId);
  rendered = 0; logEl.innerHTML = "";
  addRow("bot", "已开始新对话，请输入你的问题。");
};

// 首屏问候
addRow("bot", "你好，我是电力价格风控助手。可问我「当前电价尖峰风险高吗」，缺字段时我会反问你。");
</script>
</body>
</html>
